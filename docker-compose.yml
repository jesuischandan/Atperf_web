version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: proextract-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: proextract
      MARIADB_USER: proextract_user
      MARIADB_PASSWORD: proextract_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mariadb_data:
